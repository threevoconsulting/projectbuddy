<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060e18" />
  <title>Buddy</title>
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/css/face.css" />
</head>
<body>
  <div id="stage">
    <!-- Camera-active indicator (M7): shown only while a camera stream is live. -->
    <div id="camera-indicator"><span class="dot"></span>CAMERA ON</div>

    <!-- The face. A pure function of (emotion, amplitude); see js/face.js. -->
    <svg id="face" viewBox="0 0 200 200" aria-label="Buddy's face">
      <g id="head">
        <!-- Left eye -->
        <ellipse id="eye-l-sclera" cx="67" cy="88" rx="28" ry="28" fill="white" />
        <ellipse id="eye-l-iris" cx="67" cy="88" rx="19" ry="19" fill="#5ab4ff" />
        <ellipse id="eye-l-pupil" cx="67" cy="88" rx="11" ry="11" fill="#040c18" />
        <circle id="eye-l-light" cx="78" cy="80" r="6.5" fill="white" opacity="0.9" />
        <ellipse id="blush-l" cx="35" cy="120" rx="17" ry="8" fill="#ff8899" opacity="0.42" />
        <!-- Right eye -->
        <ellipse id="eye-r-sclera" cx="133" cy="88" rx="28" ry="28" fill="white" />
        <ellipse id="eye-r-iris" cx="133" cy="88" rx="19" ry="19" fill="#5ab4ff" />
        <ellipse id="eye-r-pupil" cx="133" cy="88" rx="11" ry="11" fill="#040c18" />
        <circle id="eye-r-light" cx="144" cy="80" r="6.5" fill="white" opacity="0.9" />
        <ellipse id="blush-r" cx="165" cy="120" rx="17" ry="8" fill="#ff8899" opacity="0.42" />
        <!-- Mouth -->
        <path id="mouth" d="M 68 140 Q 100 162 132 140" stroke="white" stroke-width="5.5"
              fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Sparkles (excited / celebrating) -->
        <g id="sparkles" style="opacity:0">
          <path d="M 158 28 L 161 36 L 169 36 L 163 41 L 165 49 L 158 44 L 151 49 L 153 41 L 147 36 L 155 36 Z"
                fill="#ffe66d" style="animation:sparkle 1.5s ease-in-out infinite;" />
          <path d="M 30 26 L 33 34 L 41 34 L 35 39 L 37 47 L 30 42 L 23 47 L 25 39 L 19 34 L 27 34 Z"
                fill="#ff9ee0" style="animation:sparkle 1.5s 0.4s ease-in-out infinite;" />
        </g>
      </g>
    </svg>

    <div id="emotion-label">Happy</div>

    <div id="thinking-dots"><div></div><div></div><div></div></div>
    <div id="listening-ring"><div class="pulse"></div><span>Listening…</span></div>

    <div id="caption"></div>

    <div id="controls">
      <button id="talk-btn" title="Hold to talk to Buddy">🎤 Hold to talk</button>
      <input id="text-input" type="text" placeholder="…or type to Buddy" autocomplete="off" />
      <button id="send-btn">Send</button>
      <button id="mock-btn" title="Cycle all expressions">Mock</button>
    </div>
  </div>

  <script src="/app/js/face.js"></script>
  <script src="/app/js/state.js"></script>
  <script src="/app/js/audio.js"></script>
  <script src="/app/js/ws-client.js"></script>
  <script src="/app/js/app.js"></script>
</body>
</html>

[project]
name = "projectbuddy"
version = "0.1.0"
description = "Buddy — a local-first AI companion for children (Threevo)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Threevo", email = "info@threevo.ca" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

# Heavy, platform-specific model runtimes. Installed ONLY on the Mac that runs the
# real voice loop — CI and the cloud dev container never install these.
#   uv sync --extra mac
[project.optional-dependencies]
mac = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "webrtcvad>=2.0.10",
    "numpy>=1.26",
    "kokoro>=0.9",          # optional, more lifelike voice (PB_TTS_BACKEND=kokoro)
]
# Phase 2 face recognition. This is a personal/home-use project, so the original
# commercial-license constraint no longer applies — InsightFace's pretrained packs
# (e.g. buffalo_l), which are non-commercial-only, are fine to use here. InspireFace
# also works; both sit behind the same FaceRecognizer seam.
perception = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "numpy>=1.26",
    "pillow>=10.0",     # decode capture frames before embedding
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
projectbuddy = "projectbuddy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projectbuddy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in argument defaults is idiomatic, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
packages = ["projectbuddy"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "piper.*",
    "webrtcvad.*",
    "insightface.*",
    "onnxruntime.*",
    "numpy.*",
    "PIL.*",
    "kokoro.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not smoke_mac'"
markers = [
    "smoke_mac: real-model smoke tests; require Ollama/Piper/Whisper on a Mac (deselected in CI)",
]
